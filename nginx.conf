# =============================================================================
# Configuration Nginx pour le Single Page Application (SPA) React / Vite
# =============================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Compression gzip pour optimiser les performances de chargement
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json image/svg+xml;

    # Gestion du routage React Router (SPA) :
    # Si le fichier ou dossier n'existe pas, renvoyer index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mise en cache agressive des assets statiques (Vite génère des hash uniques)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Sécurité : désactivation de l'accès aux fichiers cachés
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Page d'erreur personnalisée
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
